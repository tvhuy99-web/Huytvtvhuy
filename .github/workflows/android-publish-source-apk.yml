name: Publish Android Source and APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and commit verified APK
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.head.sha, '[skip publish]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore verified Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts ]]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          archive=/tmp/GeminiLiveTranslateKotlin_v1.2.0.zip
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://gemini-live-translate-build-source.netlify.app/GeminiLiveTranslateKotlin_v1.2.0.zip"
          echo "1f5f26a884162265b47b5ac4844d1d76a8dd67f6a2e8fd5ea1b722c527d2c1dc  $archive" | sha256sum --check --strict
          unzip -tq "$archive"
          rm -rf .ci-source
          mkdir -p .ci-source
          unzip -q "$archive" -d .ci-source
          test -f .ci-source/GeminiLiveTranslateKotlin/settings.gradle.kts
          echo "project_dir=$GITHUB_WORKSPACE/.ci-source/GeminiLiveTranslateKotlin" >> "$GITHUB_OUTPUT"
          echo "bootstrap=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify, test and build
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          python3 tools/verify_project.py
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean test assembleDebug

      - name: Expand source and add APK
        shell: bash
        run: |
          set -euo pipefail
          project="${{ steps.source.outputs.project_dir }}"
          mkdir -p artifacts
          cp "$project/app/build/outputs/apk/debug/app-debug.apk" artifacts/GeminiLiveTranslate-v1.2.0-debug.apk
          sha256sum artifacts/GeminiLiveTranslate-v1.2.0-debug.apk > artifacts/GeminiLiveTranslate-v1.2.0-debug.apk.sha256

          if [[ "${{ steps.source.outputs.bootstrap }}" == "true" ]]; then
            rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'app/build' "$project/" ./
            rm -rf source-archive source-xz .ci-source
          fi

      - name: Commit source and APK to pull request branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f artifacts/GeminiLiveTranslate-v1.2.0-debug.apk artifacts/GeminiLiveTranslate-v1.2.0-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "Source and APK are already current."
            exit 0
          fi
          git commit -m "Publish Android source and APK [skip publish]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-APK-Published
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
