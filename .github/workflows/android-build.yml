name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts ]]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -d source-archive
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected = {
              "part-000": "f5768dd5a8326cf97851712368321378441d6b39d3b681030c8071f1e9f7f90e",
              "part-001": "f2c1e79e3e1426534d5e0f9017336f7a40870f71e0ddee6ee3a3db9394b5acfb",
              "part-002": "382e96119910bdcadddf3c4f460cc0d5d690545220cdcbb9b351b231679d8376",
              "part-003": "31d68d425ea41207ac8cc4104a32870bda7c826b00a320d6ffa9aef30f118580",
              "part-004": "158ca9a9fcc28e258301abaed12b483aef3bca184c6853990bc3c60fdeb187ca",
              "part-005": "5cd61568d2f9f19dac612ae05ce89173c8999169d9f8f692538e91f0b9c3984d",
              "part-006": "318d84a5f5154387382a0678c8f9125ee8f835a48f919b8e3c416af51e5c5656",
              "part-007": "65bd9c5f6ab9cb524d2daaf61975ea293f66277de919f3404391d477e8f1a23b",
              "part-008": "22f8da92b99836f6797cbb61a53f3c9e0ac26e4d6ddec3d092524dbe2a79d8c8",
              "final-00": "ef004e198d50f5978935e88b057d94989a349f011969922519ddf1d369f557c6",
              "final-01": "4339df0b2b914d530999c72724f1b8bcf5cf7fe014cf6eee212a0d3e9a3d4986",
              "final-02": "279a3b74d27076c9f3fde4cfc948a3a8d3f80a0fe8662c5816c7f11c30c41b35",
              "final-03": "44655794710e8cd5acc9d3eb81e026e3e9a6197b6eaebabfc14c40e3550c6d90",
              "final-04": "ff58b10435d24576332e545f6e2d39c280ec41a2d07b9bde7600f4bbd2b92f3b",
          }
          order = list(expected)
          encoded_parts = []
          for name in order:
              path = Path("source-archive") / name
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              print(f"{name}: bytes={len(raw)} sha256={digest}")
              if digest != expected[name]:
                  raise SystemExit(f"Source chunk mismatch: {name}")
              encoded_parts.append(raw)

          encoded = b"".join(encoded_parts)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected_archive = "1f5f26a884162265b47b5ac4844d1d76a8dd67f6a2e8fd5ea1b722c527d2c1dc"
          print(f"archive: bytes={len(archive)} sha256={digest}")
          if digest != expected_archive:
              raise SystemExit("Source archive checksum mismatch")
          Path("/tmp/GeminiLiveTranslateKotlin_v1.2.0.zip").write_bytes(archive)
          PY

          unzip -tq /tmp/GeminiLiveTranslateKotlin_v1.2.0.zip
          rm -rf .ci-source
          mkdir -p .ci-source
          unzip -q /tmp/GeminiLiveTranslateKotlin_v1.2.0.zip -d .ci-source
          test -f .ci-source/GeminiLiveTranslateKotlin/settings.gradle.kts
          echo "project_dir=$GITHUB_WORKSPACE/.ci-source/GeminiLiveTranslateKotlin" >> "$GITHUB_OUTPUT"
          echo "bootstrap=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          python3 tools/verify_project.py

      - name: Run tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean test assembleDebug

      - name: Run Android lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          ./gradlew --no-daemon --stacktrace lint

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/GeminiLiveTranslate-v1.2.0-debug.apk
          cd release
          sha256sum GeminiLiveTranslate-v1.2.0-debug.apk > GeminiLiveTranslate-v1.2.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-APK
          path: ${{ steps.source.outputs.project_dir }}/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-build-reports
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/reports/**
            ${{ steps.source.outputs.project_dir }}/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Expand source on main after successful bootstrap build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.source.outputs.bootstrap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude '.git' --exclude '.github' "${{ steps.source.outputs.project_dir }}/" ./
          rm -rf source-archive source-xz .ci-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Android source project"
          git push origin HEAD:main
