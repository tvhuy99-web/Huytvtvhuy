name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts ]]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -d source-archive
          cat source-archive/part-* | base64 --decode > /tmp/GeminiLiveTranslateKotlin_v1.2.0.zip
          echo "1f5f26a884162265b47b5ac4844d1d76a8dd67f6a2e8fd5ea1b722c527d2c1dc  /tmp/GeminiLiveTranslateKotlin_v1.2.0.zip" | sha256sum --check --strict
          rm -rf .ci-source
          mkdir -p .ci-source
          unzip -q /tmp/GeminiLiveTranslateKotlin_v1.2.0.zip -d .ci-source
          test -f .ci-source/GeminiLiveTranslateKotlin/settings.gradle.kts
          echo "project_dir=$GITHUB_WORKSPACE/.ci-source/GeminiLiveTranslateKotlin" >> "$GITHUB_OUTPUT"
          echo "bootstrap=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          python3 tools/verify_project.py

      - name: Build, test and lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean test lint assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/GeminiLiveTranslate-v1.2.0-debug.apk
          cd release
          sha256sum GeminiLiveTranslate-v1.2.0-debug.apk > GeminiLiveTranslate-v1.2.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-APK
          path: ${{ steps.source.outputs.project_dir }}/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-build-reports
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/reports/**
            ${{ steps.source.outputs.project_dir }}/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Expand source on main after successful bootstrap build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.source.outputs.bootstrap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude '.git' --exclude '.github' "${{ steps.source.outputs.project_dir }}/" ./
          rm -rf source-archive .ci-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Android source project"
          git push origin HEAD:main
