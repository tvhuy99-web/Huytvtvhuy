name: Import verified Android source chunks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import-build:
    if: startsWith(github.head_ref, 'import/source-chunks')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify chunks and reconstruct source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('source-clean')
          manifest = (root / 'manifest.txt').read_text(encoding='utf-8').splitlines()
          expected_parts = {}
          expected_zip = None
          expected_length = None
          expected_count = None
          for line in manifest:
              if not line.strip():
                  continue
              if line.startswith('ZIP_SHA256  '):
                  expected_zip = line.split(None, 1)[1]
              elif line.startswith('BASE64_LENGTH  '):
                  expected_length = int(line.split(None, 1)[1])
              elif line.startswith('PART_COUNT  '):
                  expected_count = int(line.split(None, 1)[1])
              else:
                  digest, name = line.split()
                  expected_parts[name] = digest

          names = sorted(expected_parts)
          if len(names) != expected_count:
              raise SystemExit(f'Part count mismatch: {len(names)} != {expected_count}')

          encoded_parts = []
          for name in names:
              data = (root / name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              print(f'{name}: bytes={len(data)} sha256={actual}')
              if actual != expected_parts[name]:
                  raise SystemExit(f'Chunk checksum mismatch: {name}')
              encoded_parts.append(data)

          encoded = b''.join(encoded_parts)
          if len(encoded) != expected_length:
              raise SystemExit(f'Base64 length mismatch: {len(encoded)} != {expected_length}')
          archive = base64.b64decode(encoded, validate=True)
          actual_zip = hashlib.sha256(archive).hexdigest()
          print(f'zip: bytes={len(archive)} sha256={actual_zip}')
          if actual_zip != expected_zip:
              raise SystemExit('ZIP checksum mismatch')
          Path('/tmp/source.zip').write_bytes(archive)
          PY
          unzip -tq /tmp/source.zip
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          test -f /tmp/source/GeminiLiveTranslate_GitHubReady_v1.2.0/settings.gradle.kts

      - name: Replace repository with complete source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/GeminiLiveTranslate_GitHubReady_v1.2.0/. ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f .github/workflows/android.yml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Verify complete project
        run: python3 tools/verify_project.py

      - name: Run tests and build APK
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon --stacktrace clean test assembleDebug

      - name: Prepare and validate APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GeminiLiveTranslate-v1.2.0-debug.apk
          sha256sum artifacts/GeminiLiveTranslate-v1.2.0-debug.apk > artifacts/GeminiLiveTranslate-v1.2.0-debug.apk.sha256
          unzip -tq artifacts/GeminiLiveTranslate-v1.2.0-debug.apk

      - name: Commit complete source and APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Android source and verified APK"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
