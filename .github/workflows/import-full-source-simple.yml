name: Import Full Source Simple

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import-build:
    if: startsWith(github.head_ref, 'import/full-source')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download and expand verified source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f settings.gradle.kts ]]; then
            curl -fL --retry 5 --retry-delay 3 \
              https://gemini-live-translate-build-source.netlify.app/GeminiLiveTranslateKotlin_v1.2.0.zip \
              -o /tmp/source.zip
            echo "1f5f26a884162265b47b5ac4844d1d76a8dd67f6a2e8fd5ea1b722c527d2c1dc  /tmp/source.zip" | sha256sum -c -
            unzip -tq /tmp/source.zip
            rm -rf /tmp/source
            mkdir -p /tmp/source
            unzip -q /tmp/source.zip -d /tmp/source
            test -f /tmp/source/GeminiLiveTranslateKotlin/settings.gradle.kts
            rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/source/GeminiLiveTranslateKotlin/ ./
            rm -rf source-archive source-xz .ci-source BUILD_FAILURE_CONFIRMED.txt IMPORT_FULL_SOURCE.txt
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Verify complete project
        run: python3 tools/verify_project.py

      - name: Run tests and build APK
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon --stacktrace clean test assembleDebug

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GeminiLiveTranslate-v1.2.0-debug.apk
          sha256sum artifacts/GeminiLiveTranslate-v1.2.0-debug.apk > artifacts/GeminiLiveTranslate-v1.2.0-debug.apk.sha256
          unzip -tq artifacts/GeminiLiveTranslate-v1.2.0-debug.apk

      - name: Commit complete source and APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete Android source and verified APK"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
